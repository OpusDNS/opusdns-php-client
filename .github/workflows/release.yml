name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version number to increase
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'no-release'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run tests
        run: composer test

      - name: Run static analysis
        run: composer stan

      - name: Read the version bump from the input or the pull request labels
        id: bump
        env:
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          LABELS: " ${{ join(github.event.pull_request.labels.*.name, ' ') }} "
        run: |
          bump="${INPUT_BUMP:-patch}"
          case "$LABELS" in
            *' major '*) bump=major ;;
            *' minor '*) bump=minor ;;
          esac
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Calculate the next version and push the tag
        id: version
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          version="v${major}.${minor}.${patch}"
          git tag "$version"
          git push origin "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.version.outputs.version }}" --generate-notes

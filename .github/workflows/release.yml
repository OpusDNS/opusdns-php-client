name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version number to increase
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'no-release'))
    runs-on: self-hosted
    # Each host runs several runners. setup-php would install PHP on the host with
    # apt and switch the host's default php, so jobs on one host could run with
    # each other's version. The official image gives every job its own PHP.
    container: php:8.3-cli

    env:
      # Keeps Composer's cache in the container instead of the runner's home.
      COMPOSER_CACHE_DIR: /tmp/composer-cache

    steps:
      # git before checkout, or actions/checkout downloads the tree without .git.
      - name: Install git, unzip, gh and Composer
        env:
          DEBIAN_FRONTEND: noninteractive
          # Bump both together. The checksum is on https://getcomposer.org/download/.
          COMPOSER_VERSION: 2.11.3
          COMPOSER_SHA256: 04f8b003da4e3a2459056591fbfebd02b4dc3e5adeb158616b90cf55a65113ec
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git unzip gh
          # The workspace belongs to the runner user, and the container runs as root.
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          curl -fsSL -o /usr/local/bin/composer "https://getcomposer.org/download/${COMPOSER_VERSION}/composer.phar"
          echo "${COMPOSER_SHA256}  /usr/local/bin/composer" | sha256sum -c -
          chmod +x /usr/local/bin/composer

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run tests
        run: composer test

      - name: Run static analysis
        run: composer stan

      - name: Read the version bump from the input or the pull request labels
        id: bump
        env:
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          LABELS: " ${{ join(github.event.pull_request.labels.*.name, ' ') }} "
        run: |
          bump="${INPUT_BUMP:-patch}"
          case "$LABELS" in
            *' major '*) bump=major ;;
            *' minor '*) bump=minor ;;
          esac
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Calculate the next version and push the tag
        id: version
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          version="v${major}.${minor}.${patch}"
          git tag "$version"
          git push origin "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.version.outputs.version }}" --generate-notes

      # Files written in the container belong to root on the host. Hand them back
      # to the runner user, or the next job on this runner cannot clean them up.
      - name: Hand the workspace back to the runner user
        if: always()
        run: chown -R "$(stat -c '%u:%g' "$GITHUB_WORKSPACE/../..")" "$GITHUB_WORKSPACE" "$HOME"

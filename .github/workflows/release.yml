name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version number to increase
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'no-release'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run tests
        run: composer test

      - name: Run static analysis
        run: composer stan

      - name: Read the version bump from the input or the pull request labels
        id: bump
        env:
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          LABELS: " ${{ join(github.event.pull_request.labels.*.name, ' ') }} "
        run: |
          bump="${INPUT_BUMP:-patch}"
          case "$LABELS" in
            *' major '*) bump=major ;;
            *' minor '*) bump=minor ;;
          esac
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Calculate the version and push the tag
        id: version
        uses: bitshifted/git-auto-semver@v2
        with:
          create_tag: true
          manual_bump: ${{ steps.bump.outputs.bump }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version-string }}
          generate_release_notes: true

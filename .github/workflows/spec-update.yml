name: Spec update

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: api-spec branch, tag or commit to sync the specification from
        required: false
        default: main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: Sync and regenerate
    runs-on: self-hosted
    # Each host runs several runners. setup-php would install PHP on the host with
    # apt and switch the host's default php, so jobs on one host could run with
    # each other's version. The official image gives every job its own PHP.
    container: php:8.3-cli

    env:
      # Keeps Composer's cache in the container instead of the runner's home.
      COMPOSER_CACHE_DIR: /tmp/composer-cache

    steps:
      # git before checkout, or actions/checkout downloads the tree without .git.
      - name: Install git, unzip and Composer
        env:
          DEBIAN_FRONTEND: noninteractive
          # Bump both together. The checksum is on https://getcomposer.org/download/.
          COMPOSER_VERSION: 2.11.3
          COMPOSER_SHA256: 04f8b003da4e3a2459056591fbfebd02b4dc3e5adeb158616b90cf55a65113ec
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git unzip
          # The workspace belongs to the runner user, and the container runs as root.
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          curl -fsSL -o /usr/local/bin/composer "https://getcomposer.org/download/${COMPOSER_VERSION}/composer.phar"
          echo "${COMPOSER_SHA256}  /usr/local/bin/composer" | sha256sum -c -
          chmod +x /usr/local/bin/composer

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Sync the specification from api-spec
        run: bin/spec-sync --ref "${{ github.event.inputs.ref || 'main' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate the client
        run: composer generate

      - name: Detect changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- src spec)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "commit=$(sed -n 's/^api_spec_commit: //p' spec/version.yaml | cut -c1-7)" >> "$GITHUB_OUTPUT"
            echo "package=$(sed -n 's/^npm_version: //p' spec/version.yaml)" >> "$GITHUB_OUTPUT"
            echo "spec=$(sed -n 's/^info_version: //p' spec/version.yaml)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.diff.outputs.changed == 'true'
        run: composer test

      - name: Run static analysis
        if: steps.diff.outputs.changed == 'true'
        run: composer stan

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            src/**
            spec/**
          branch: bot/spec-update
          commit-message: update api spec to ${{ steps.diff.outputs.commit }}
          title: Update the API specification to ${{ steps.diff.outputs.commit }}
          body: |
            Regenerated from `OpusDNS/api-spec@${{ steps.diff.outputs.commit }}` (package ${{ steps.diff.outputs.package }}, spec ${{ steps.diff.outputs.spec }}).

            Tests and static analysis passed on the regenerated client before this pull request was opened.
          labels: |
            automated
            spec-update
          delete-branch: true

      # Files written in the container belong to root on the host. Hand them back
      # to the runner user, or the next job on this runner cannot clean them up.
      - name: Hand the workspace back to the runner user
        if: always()
        run: chown -R "$(stat -c '%u:%g' "$GITHUB_WORKSPACE/../..")" "$GITHUB_WORKSPACE" "$HOME"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: self-hosted
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    env:
      PHP_IMAGE: opusdns-php-client-ci:${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build the PHP image
        run: docker build --pull --build-arg "PHP_VERSION=${{ matrix.php }}" --tag "$PHP_IMAGE" .github/php

      - name: Install dependencies
        run: .github/php/run composer install --no-interaction --no-progress

      - name: Validate composer.json
        run: .github/php/run composer validate --strict --no-check-publish

      - name: Generated code must match the committed specification
        run: |
          .github/php/run composer generate
          git diff --exit-code -- src spec
          test -z "$(git status --porcelain -- src spec)"

      - name: Run tests
        run: .github/php/run composer test

      - name: Run static analysis
        run: .github/php/run composer stan

  # Fails when any job in `needs` failed or was cancelled.
  ci-ok:
    if: always()
    needs: [test]
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')

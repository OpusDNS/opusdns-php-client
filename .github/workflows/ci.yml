name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Generated code must match the committed specification
        run: |
          composer generate
          git diff --exit-code -- src spec
          test -z "$(git status --porcelain -- src spec)"

      - name: Run tests
        run: composer test

      - name: Run static analysis
        run: composer stan
